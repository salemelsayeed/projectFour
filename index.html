<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./css/media.css">
    <title>The UX Review Blog</title>
</head>
<body>
    <div class="header">
        <div class="container">
            <div class="navbar">
                <div class="icon">
                    <a href="#">The UX<span>Review</span></a>
                </div>
                <input type="checkbox" id="nav-toggle">
                <div class="hamburger-icon">
                    <label for="nav-toggle">
                        <i class="fa-solid fa-bars"></i>
                    </label>
                </div>
                <div class="overlay"></div>
                <div class="mobile-menu">
                    <div class="close-menu">
                        <span>MENU</span>
                        <input type="checkbox" id="nav-toggle">
                        <label for="nav-toggle">
                            <i class="fa-solid fa-xmark"></i>
                        </label>
                    </div>
                    <ul>
                        <li><a href="#">HOME</a></li>
                        <li><a href="#">LATEST ARTICLES</a></li>
                        <li><a href="#">AUTHORS</a></li>
                        <li><a href="#">COMMUNITY</a></li>
                    </ul>
                    <div class="mobile-nav-btn">
                        <button><i class="fa-solid fa-rocket"></i>SUBSCRIPE NOW</button>
                    </div>
                </div>
                <div class="links">
                    <ul>
                        <li>
                            <a href="#">HOME</a>
                            <i class="fa-solid fa-star"></i>
                        </li>
                        <li>
                            <a href="#">LATEST ARTICLES</a>
                            <i class="fa-solid fa-star"></i>
                        </li>
                        <li>
                            <a href="#">AUTHORS</a>
                            <i class="fa-solid fa-star"></i>
                        </li>
                        <li>
                            <a href="#">COMMUNITY</a>
                        </li>
                    </ul>
                </div>
                <div class="nav-btn">
                    <button>SUBSCRIBE NOW</button>
                </div>
            </div>
        </div>
    </div>
    <div id="home">
        <div class="container">
            <div class="hero">
                <div class="hero-content">
                    <div class="trending-badge"><span>🔥 TRENDING NOW</span></div>
                    <h2>
                        BRUTAL
                        <span class="color-r">THOUGHTS</span>
                        <span class="color-b">BOLD IDEAS</span>
                    </h2>
                    <p>Raw, unfiltered content about tech, design, and culture. No sugar-coating, just pure truth that hits different.</p>
                    <div class="hero-btns">
                        <div class="btn-shape">
                            <button class="btn1"><i class="fa-solid fa-rocket"></i>START READING</button>
                        </div>
                        <div>
                            <button class="btn2"><i class="fa-solid fa-play"></i>WATCH INTRO</button>
                        </div>
                    </div>
                </div>
                <div class="hero-image">
                    <div class="image">
                        <img src="./images/hero-img.png" alt="hero image">
                    </div>
                    <span>FEATURED</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
